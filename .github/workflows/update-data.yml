name: Actualizar datos

# Baja el dólar, el IPC y el ICL todos los días, los valida y los publica en docs/.
# Si una fuente falla o devuelve algo raro, el archivo anterior se conserva y el trabajo termina en rojo
# (GitHub avisa por mail) para que alguien lo mire.
on:
  schedule:
    - cron: '30 12 * * *' # 12:30 UTC = 09:30 en Argentina
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar y validar
        id: fetch
        run: node tool/update_snapshots.mjs docs
        continue-on-error: true
      - name: Publicar los cambios
        run: |
          git config user.name "datos-bot"
          git config user.email "datos-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Actualiza datos $(date -u +%F)" && git push)
      - name: Avisar si algo falló
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Alguna fuente falló o devolvió datos raros; se conservó la versión anterior."
          exit 1
